[project]
name = "smoothli-dino-v2"
description = "Smoothli DINO v2 compute tool"
authors = [{name = "Jakub Bednarek"}]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "click (>=8.1.8,<9.0.0)",
    "msgspec (>=0.19.0,<1.0.0)",
    "numpy (>=2.2.3,<3.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "torch (>=2.7.0,<3.0.0)",
    "transformers (>=4.52.0,<5.0.0)"
]
version = "0.1.0"

[dependency-groups]
qa = [
    "coverage (>=7.6.10,<8.0.0)",
    "pytest (>=8.3.4,<9.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "ruff (>=0.9.7,<1.0.0)"
]

[build-system]
requires = ["poetry-core>=2.3.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
requires-poetry = ">=2.3.1"
packages = [{ include = "smoothli_dino_v2" }]

[tool.poetry.scripts]
smoothli-dino-v2 = "smoothli_dino_v2.__main__:cli"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--color=yes --strict-config --strict-markers --verbosity=2"
testpaths = ["tests/unit"]